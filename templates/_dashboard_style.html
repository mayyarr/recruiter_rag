<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #090d16;
    color: #f1f5f9;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px 60px; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 26px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #fff;
    letter-spacing: -0.4px;
  }
  .subtitle { color: #94a3b8; font-size: 14px; margin: 0; }

  .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-link {
    text-decoration: none;
    background: #17243c;
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #818cf8;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .nav-link:hover { background: rgba(99, 102, 241, 0.15); border-color: #6366f1; }

  .flash-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .flash-msg { border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.5; border: 1px solid transparent; }
  .flash-success { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
  .flash-error { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 30px;
  }
  .summary-card {
    background: #111a2e;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }
  .summary-card .label { font-size: 12px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .summary-card .value { font-size: 28px; font-weight: 800; color: #fff; }
  .summary-card.accent .value { color: #818cf8; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-row label { font-size: 13px; color: #94a3b8; font-weight: 600; }
  .filter-row select {
    background: #141f36;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f1f5f9;
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 13.5px;
  }

  .card {
    background: #111a2e;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 24px;
  }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data-table th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    font-weight: 700;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  table.data-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
  }
  table.data-table tr:last-child td { border-bottom: none; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .status-Applied { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
  .status-Screening { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
  .status-Interview { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .status-Hold { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

  .view-link {
    text-decoration: none;
    background: rgba(99, 102, 241, 0.12);
    color: #818cf8;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .view-link:hover { background: rgba(99, 102, 241, 0.22); }

  .empty-state { text-align: center; color: #4b5568; font-size: 13.5px; padding: 40px 20px; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); }

  .field-label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .field-hint { font-size: 12px; color: #64748b; margin: -2px 0 10px; }
  .field-missing { color: #fbbf24; font-weight: 600; }

  input[type="text"], input[type="email"], input[type="file"], select, textarea {
    width: 100%;
    background: #17243c;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    padding: 11px 13px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }

  .profile-meta { display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 6px; }
  .profile-meta div .k { font-size: 11.5px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .profile-meta div .v { font-size: 14.5px; color: #f1f5f9; font-weight: 600; }

  .note-mini { background: #17243c; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 13.5px; color: #cbd5e1; }

  .inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .inline-form > div { flex: 1; min-width: 140px; }
  .inline-form input, .inline-form select { margin-bottom: 0; }

  .score-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 26px; padding: 0 8px;
    background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
    border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 8px;
    font-weight: 700; font-size: 13px;
  }

  .chat-answer {
    background: #17243c;
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13.5px;
    color: #e2e8f0;
    line-height: 1.6;
    margin-top: 14px;
  }
  .chat-answer .q { color: #818cf8; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }

  .evidence-mini {
    background: #111a2e;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 12.5px;
    color: #94a3b8;
    font-style: italic;
  }
  .evidence-mini .src { color: #818cf8; font-style: normal; font-weight: 600; margin-bottom: 3px; }

  .interview-card {
    background: #17243c;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .interview-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .interview-when { font-weight: 700; color: #fff; font-size: 14px; }
  .status-Scheduled { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .status-Cancelled { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  .status-Completed { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

  .link-btn {
    background: none; border: none; color: #818cf8; font-size: 12.5px;
    font-weight: 600; cursor: pointer; padding: 0; text-decoration: none;
  }
  .link-btn.danger { color: #f87171; }
  .link-row { display: flex; gap: 14px; margin-top: 6px; }

  .proposed-action-card {
    background: #17243c;
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 32px;
  }
  .proposed-action-card .title { font-size: 12.5px; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .proposed-action-card .row { font-size: 13.5px; color: #e2e8f0; margin-bottom: 4px; }
  .proposed-action-card .row .k { color: #64748b; margin-right: 6px; }
  .proposed-action-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn-approve {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; border: none; border-radius: 10px; padding: 9px 18px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel-action {
    background: rgba(255,255,255,0.06); color: #cbd5e1; border: none;
    border-radius: 10px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
</style>
